spring:
  config:
    import: optional:file:.env[.properties],optional:classpath:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    repair-on-migrate: true
    default-schema: ${DB_SCHEMA:public}
    schemas: ${DB_SCHEMA:public}
    create-schemas: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  access-link-base: ${APP_ACCESS_LINK_BASE:https://secureflow.com/access}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}

server:
  port: ${PORT:8080}

llm:
  base-url: ${LLM_BASE_URL:https://api.groq.com/openai/v1}
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:llama-3.3-70b-versatile}
  chat-endpoint: ${LLM_CHAT_ENDPOINT:/chat/completions}
  timeout-ms: ${LLM_TIMEOUT_MS:120000}
  max-retries: ${LLM_MAX_RETRIES:2}
  retry-backoff-ms: ${LLM_RETRY_BACKOFF_MS:500}

management:
  endpoints:
    web:
      exposure:
        include: health,info
      cors:
        allowed-origins: http://localhost:4200,https://prime-sprint-t1-secure-la-git-22a7c7-theekshana-nuwans-projects.vercel.app,https://securelaw.vercel.app,https://preview-securelaw.vercel.app
        allowed-methods: GET,OPTIONS
        allow-credentials: true
  endpoint:
    health:
      show-details: never